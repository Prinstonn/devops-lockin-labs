
name: Day 5 - Bash CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  health-check:
    name: Validate and Run Bash Script
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate health-check syntax
        run: bash -n day5-cicd/health-check.sh

      - name: Validate test script syntax
        run: bash -n day5-cicd/tests/test-health-check.sh

      - name: Execute health check
        run: bash day5-cicd/health-check.sh

      - name: Run automated tests
        run: bash day5-cicd/tests/test-health-check.sh
